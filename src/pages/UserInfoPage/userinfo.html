<link rel="stylesheet" href="../UserInfoPage/userinfo.css">

<div class="user-info-popup-content">
    <button class="popup-close-btn" id="close-popup">&times;</button>
    <div class="user-details">
        <h3 id="popup-username">Tên người dùng</h3>
    </div>
    <div class="user-actions">
        <button id="friendStatus-btn" class="btn-friend" title="Gửi lời mời kết bạn">+ Friend</button>
        <button id="chat-btn" class="btn-chat">Chat</button>
    </div>

    <div id="popup-menu" class="sub-menu-hidden">
        <button class="btn-sub" title="Đồng ý lời mời kết bạn" id="acceptButton">✓</button>
        <button class="btn-sub" title="Từ chối lời mời kết bạn" id="denyButton">✕</button>
    </div>
</div>
